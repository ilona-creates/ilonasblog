<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All in one place</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
/* Lora everywhere. Black titles, slate body. White paper. */
:root{color-scheme:light;
  --paper:#FFFFFF;--ink:#000;--body:#2f3b4c;--ink-soft:#5a6474;--blue:#3F6899;--blue-ink:#2E5688;--rule:rgba(29,43,79,0.2);
  --serif:'PT Serif',Georgia,serif;
  --sans:'Lora',Georgia,serif;
  --max:1100px}
*{margin:0;padding:0;box-sizing:border-box;min-width:0}
html{overflow-x:clip}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:400;font-size:18px;line-height:1.5;
  -webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1;overflow-x:clip}
p{text-wrap:pretty}
.wrap{max-width:var(--max);margin:0 auto;padding:0 32px}
header{padding:28px 0}
.header-inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 20px}
.brand-name{font-size:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);text-decoration:none;white-space:nowrap}
.nav-link{font-size:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);text-decoration:none;
  border-bottom:1px solid var(--rule);padding:10px 0 4px;transition:border-color .2s ease,color .2s ease}
.nav-link:hover,.nav-link[aria-current]{border-bottom-color:var(--ink)}
.link{color:inherit;text-decoration:underline;text-decoration-color:rgba(63,104,153,.5);text-decoration-thickness:1px;text-underline-offset:7px;transition:color .2s ease,text-decoration-color .2s ease}
.link:hover{color:var(--blue-ink);text-decoration-color:var(--blue)}
a:focus-visible{outline:2px solid var(--blue);outline-offset:4px}
footer.page{padding:48px 0 56px;text-align:center;font-size:16px;color:var(--ink-soft);border-top:1px solid var(--rule)}
@media (max-width:720px){body{font-size:18px}.wrap{padding:0 24px}.brand-name,.nav-link{font-size:15px;letter-spacing:.04em}}

main .wrap{max-width:calc(36em + 64px)}
.page-title{font-family:var(--sans);font-weight:600;letter-spacing:-.005em;font-size:clamp(31px,3.9vw,50px);line-height:1.18;padding:88px 0 56px;text-wrap:balance}
/* left side panel, like Seth's blog */
.layout{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;border-right:1px solid #e3e5e8;padding:40px 32px}
.side-brand{display:flex;align-items:center;gap:16px;text-decoration:none;color:var(--ink);margin-bottom:48px}
.side-photo{width:72px;height:72px;border-radius:50%;object-fit:cover;object-position:50% 30%;flex:none}
.side-name{font-weight:600;font-size:22px;line-height:1.2}
.side-h{font-size:17px;font-weight:700;margin:0 0 8px}
.side-p{font-family:var(--serif);font-size:16px;line-height:1.45;color:var(--body);margin:0 0 12px}
.sub-row{display:flex;gap:8px;align-items:stretch}
.sub-row label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.sub-row input{flex:1 1 auto;width:0;font:inherit;font-size:16px;color:var(--ink);background:transparent;border:0;border-bottom:1px solid #c9ccd2;border-radius:0;padding:8px 0;min-height:44px}
.sub-row input::placeholder{color:var(--ink-soft);opacity:.7}
.sub-row input:focus{outline:none;border-bottom-color:var(--ink)}
.sub-row button{flex:none;font:inherit;font-size:15px;font-weight:600;color:var(--ink-soft);background:#fff;border:1px solid #c9ccd2;border-radius:4px;padding:0 14px;min-height:44px;cursor:pointer;transition:border-color .2s ease,color .2s ease}
.sub-row button:hover{border-color:#8f949c;color:var(--ink)}
.sub-row button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sub-msg{font-size:15px;margin-top:8px;color:var(--ink-soft)}
.sub-msg:empty{display:none}
.sub-msg.err{color:#a3261b}
.sub-done{font-family:var(--serif);font-size:16px;color:var(--ink);margin:0}
.side-list{margin-top:44px}
.side-month{font-size:17px;font-weight:700;margin:0 0 6px}
.side-titles{list-style:none;margin:0 0 24px;padding:0}
.side-titles li{margin:0 0 6px;line-height:1.35}
.side-titles a{font-size:16px;color:var(--ink);text-decoration:none}
.side-titles a:hover{text-decoration:underline;text-underline-offset:4px;text-decoration-color:#c9ccd2}
.side-all{display:inline-block;font-size:16px;font-weight:600;color:var(--ink-soft);text-decoration:none;border-bottom:1px solid #c9ccd2;padding:8px 0 2px}
.side-all:hover{color:var(--ink);border-bottom-color:var(--ink)}
.content main{padding-top:24px}
.note:first-of-type{border-top:0;padding-top:40px}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid #e3e5e8;padding:24px}
  .side-brand{margin-bottom:24px}.side-photo{width:56px;height:56px}.side-name{font-size:19px}
}
/* one short note: date, title, body */
.note{border-top:1px solid var(--ink);padding:44px 0 72px}
.date{display:block;margin-bottom:14px;font-size:16px;font-weight:700;letter-spacing:.01em;text-transform:uppercase;color:var(--ink);line-height:1.4}
.note h2{font-family:var(--sans);font-weight:600;font-size:35px;line-height:1.15;letter-spacing:-.005em;margin:14px 0 24px;text-wrap:balance}
.note h2 a{color:inherit;text-decoration:none}
.note .text{font-family:var(--serif);font-size:18px;line-height:1.5;color:var(--body)}
.note .text p{margin:0 0 1.05em}
.note .text a{color:#1a47e5;text-decoration:none}.note .text a:hover{text-decoration:underline}
/* Short / Long label, long pieces open in a pop-up */
.note.is-long .text{max-height:var(--preview,70vh);overflow:hidden;-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent)}
.read-btn{display:none;font:inherit;font-size:17px;font-weight:600;color:var(--ink-soft);background:#fff;border:1.5px solid #c9ccd2;border-radius:4px;padding:11px 26px;min-height:48px;cursor:pointer;margin-top:8px;transition:border-color .2s ease,color .2s ease}
.note.is-long .read-btn{display:inline-block}
.read-btn:hover{border-color:#8f949c;color:var(--ink)}.read-btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.pop{position:fixed;inset:0;z-index:50;display:none;background:#fff}
.pop.open{display:flex}
.pop-box{position:relative;background:#fff;width:100%;height:100%;overflow-y:auto;padding:clamp(40px,6vw,80px) clamp(24px,7vw,96px);overscroll-behavior:contain;animation:up .28s ease}
.pop-inner{max-width:36em;margin:0 auto}
.pop-close{position:fixed;top:clamp(16px,3vw,32px);right:clamp(16px,3vw,32px);z-index:1;width:44px;height:44px;font:400 26px/1 var(--serif);color:var(--ink);background:#fff;border:1px solid var(--ink);border-radius:4px;cursor:pointer}
.pop-close:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.pop h2{font-family:var(--sans);font-weight:600;font-size:35px;line-height:1.15;margin:14px 0 28px;text-wrap:balance}
.pop .text{font-family:var(--serif);font-size:18px;line-height:1.5;color:var(--body)}
.pop .text p{margin:0 0 1.05em}
.pop .text a{color:#1a47e5;text-decoration:none}
.pop-back{position:fixed;top:clamp(12px,2.5vw,28px);right:clamp(12px,3vw,32px);z-index:1;font:inherit;font-size:16px;color:var(--ink-soft);background:#fff;border:0;border-radius:4px;padding:10px 12px;min-height:44px;cursor:pointer}
.pop-back:hover{color:var(--ink)}
.pop-box:focus{outline:none}
.pop-back:focus-visible{outline:2px solid var(--ink);outline-offset:-4px}
body.locked{overflow:hidden}
.pop-piece{padding:0 0 72px}
.pop-piece + .pop-piece{border-top:1px solid var(--ink);padding-top:44px}
.pop-inner{position:relative;padding:24px 0 50vh}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pop-box{animation:none}}
@media (max-width:600px){.pop-box{padding:72px 22px 48px}}
@media (max-width:720px){.page-title{padding:56px 0 40px}}
.arc-back{display:inline-block;font-size:16px;color:var(--ink-soft);text-decoration:none;padding:10px 0;margin-top:16px}
.arc-back:hover{color:var(--ink)}
.arc-title{font-weight:600;font-size:35px;line-height:1.15;margin:40px 0 8px}
.arc-year{font-weight:600;font-size:28px;line-height:1.2;margin:48px 0 8px}
.arc-month{font-size:17px;font-weight:700;margin:24px 0 4px}
.arc-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.arc-list li{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:12px 0;border-bottom:1px solid #e3e5e8}
.arc-list a{font-size:18px;color:var(--ink);text-decoration:none;line-height:1.35}
.arc-list a:hover{text-decoration:underline;text-underline-offset:4px;text-decoration-color:#c9ccd2}
.arc-list time{flex:none;font-size:16px;color:var(--ink-soft);white-space:nowrap}
@media (max-width:520px){.arc-list li{flex-direction:column;gap:2px}}
</style>
</head>
<body>
<div>
<header>
  <div class="wrap header-inner">
    <a class="brand-name" href="index.html">Ilona Melnychuk</a>
  </div>
</header>
<div class="content">
<main>
  <div class="wrap">
    <a class="arc-back" href="notes.html">← Back to recent</a>
    <h1 class="arc-title">All in one place</h1>
    <div id="archive" style="padding-bottom:80px"></div>
  </div>
</main>
<footer class="page">© Ilona Melnychuk</footer>
</div>
</div>
<div class="pop" id="pop" role="dialog" aria-modal="true" aria-label="Writing">
  <div class="pop-box" id="pop-box" tabindex="-1">
    <button class="pop-back" id="pop-close" type="button">← Back to all writing</button>
    <div class="pop-inner" id="pop-inner"></div>
  </div>
</div>
<script src="writing.js"></script>
<script>
{
  const el = document.getElementById('archive');
  const pop = document.getElementById('pop'), box = document.getElementById('pop-box');
  const closeBtn = document.getElementById('pop-close');
  let src = null, lastFocus = null;

  // A title opens the pop-up with every piece in it, scrolled to the one clicked,
  // so the reader can keep scrolling through the others
  const esc = (t) => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let filled = false;
  const fill = () => {
    if (filled || !src) return;
    const items = IM.collect(src);
    document.getElementById('pop-inner').innerHTML = items.map(n => {
      const a = src.getElementById(n.id);
      return `<article class="pop-piece" data-id="${esc(n.id)}">
        <time class="date" datetime="${esc(n.iso)}">${IM.fullDate(n)}</time>
        ${a.querySelector('h2') ? `<h2>${esc(a.querySelector('h2').textContent)}</h2>` : ''}
        <div class="text">${a.querySelector('.text').innerHTML}</div>
      </article>`;
    }).join('');
    filled = true;
  };
  const open = (id) => {
    fill();
    const piece = [...document.querySelectorAll('.pop-piece')].find(p => p.dataset.id === id);
    if (!piece) return;
    if (!pop.classList.contains('open')) lastFocus = document.activeElement;
    pop.classList.add('open'); document.body.classList.add('locked');
    // put the clicked title a little above the middle of the screen
    box.scrollTop = 0;
    const h = (piece.querySelector('h2') || piece.querySelector('.text')).getBoundingClientRect(), b = box.getBoundingClientRect();
    box.scrollTop = h.top - b.top - box.clientHeight * 0.38 + h.height / 2;
    box.focus({ preventScroll: true });
  };
  const close = () => {
    pop.classList.remove('open'); document.body.classList.remove('locked');
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
    if (lastFocus) lastFocus.focus();
  };
  const route = () => {
    const id = location.hash.slice(1);
    if (id) open(id); else if (pop.classList.contains('open')) close();
  };

  el.addEventListener('click', e => {
    const a = e.target.closest('a[href^="notes.html#"]');
    if (!a) return;
    e.preventDefault();
    location.hash = a.getAttribute('href').split('#')[1];
  });
  closeBtn.addEventListener('click', close);
  document.addEventListener('keydown', e => {
    if (!pop.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    if (e.key === 'Tab') { e.preventDefault(); closeBtn.focus(); }
  });
  window.addEventListener('hashchange', route);

  fetch('notes.html').then(r => r.text()).then(html => {
    src = new DOMParser().parseFromString(html, 'text/html');
    IM.renderArchive(IM.collect(src), el);
    route();
  }).catch(() => { el.innerHTML = '<p class="arc-empty">The list could not be loaded.</p>'; });
}
</script>
</body>
</html>
