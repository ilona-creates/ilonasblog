<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ilona Melnychuk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Lora everywhere. Black titles, slate body. White paper. */
:root{color-scheme:light;
  --paper:#FFFFFF;--ink:#000;--body:#2f3b4c;--ink-soft:#5a6474;--blue:#3F6899;--blue-ink:#2E5688;--rule:rgba(29,43,79,0.2);
  --serif:'Lora',Georgia,serif;
  --sans:'Lora',Georgia,serif;
  --max:1100px}
*{margin:0;padding:0;box-sizing:border-box;min-width:0}
html{overflow-x:clip}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:400;font-size:19px;line-height:1.8;
  -webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1;overflow-x:clip}
p{text-wrap:pretty}
.wrap{max-width:var(--max);margin:0 auto;padding:0 32px}
header{padding:28px 0}
.header-inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 20px}
.brand-name{font-size:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);text-decoration:none;white-space:nowrap}
.tabs{display:flex;gap:24px}
@media (max-width:720px){.tabs{gap:16px}}
.nav-link{font-size:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);text-decoration:none;
  border-bottom:1px solid var(--rule);padding:10px 0 4px;transition:border-color .2s ease}
.nav-link:hover{border-bottom-color:var(--ink)}
.nav-link[aria-current]{color:#5a55c8;border-bottom-color:#5a55c8}
.link{color:inherit;text-decoration:underline;text-decoration-color:rgba(63,104,153,.5);text-decoration-thickness:1px;text-underline-offset:7px;transition:color .2s ease,text-decoration-color .2s ease}
.link:hover{color:var(--blue-ink);text-decoration-color:var(--blue)}
a:focus-visible{outline:2px solid var(--blue);outline-offset:4px}
footer.page{padding:48px 24px 56px;text-align:center;font-size:16px;color:var(--ink-soft);border-top:1px solid var(--rule)}
.foot-note{max-width:34em;margin:0 auto 20px;line-height:1.6;text-wrap:balance}
@media (max-width:720px){body{font-size:18px}.wrap{padding:0 24px}.brand-name,.nav-link{font-size:15px;letter-spacing:.04em}}

.cover{padding:48px 0 64px}
h1{font-family:var(--sans);font-weight:600;font-size:clamp(26px,3.4vw,40px);line-height:1.25;letter-spacing:-.005em;max-width:17em;text-wrap:balance}
.strip{display:flex;gap:16px;overflow-x:auto;padding:0 max(32px,calc((100vw - var(--max))/2 + 32px)) 112px;scrollbar-width:thin}
.strip img{height:clamp(220px,30vw,380px);width:auto;flex:none;display:block;border-radius:4px}
.cover h1{max-width:none;white-space:nowrap}
.cover h1 a{color:#5a55c8;text-decoration:underline;text-decoration-color:#5a55c8;text-decoration-thickness:1px;text-underline-offset:.18em;transition:color .2s ease,text-decoration-color .2s ease}
.cover h1 a:hover{color:#443fb0;text-decoration-color:#443fb0}
@media (max-width:720px){.cover h1{font-size:clamp(15px,4.8vw,29px)}}
@media (max-width:720px){.cover{padding:28px 0 48px}.strip{padding:0 24px 72px}}
</style>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Ilona Melnychuk">
<meta property="og:title" content="Ilona Melnychuk">
<meta property="og:image" content="https://ilonamelnychuk.com/img/social.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://ilonamelnychuk.com/img/social.jpg">
</head>
<body>
<header>
  <div class="wrap header-inner">
    <a class="brand-name" href="index.html">Ilona Melnychuk</a>
    <nav class="tabs"><a class="nav-link" href="notes.html">Writing</a><a class="nav-link" href="videos.html">Videos</a></nav>
  </div>
</header>
<main>
  <section class="cover">
    <div class="wrap">
      <h1>I believe I am what I <a href="notes.html">think</a> and <a href="videos.html">do</a></h1>
    </div>
  </section>
  <section class="strip" aria-label="Photos">
    <img src="img/1.jpg" alt="Ilona at a Paris café, holding a green notebook">
    <img src="img/2.jpg" alt="Ilona writing in a notebook at a café table, seen through the window">
    <img src="img/3.jpg" alt="Portrait of Ilona smiling">
    <img src="img/5.jpg" alt="Ilona writing at a café table">
    <img src="img/4.jpg" alt="Ilona working on a laptop by the Seine">
  </section>
</main>
<footer class="page">
  <p class="foot-note">I'd like to see myself evolve, and create something as I do. The writing and videos on this website are my idea of what that looks like in practice. My intention is that it will be helpful for you too.</p>
  <p>© Ilona Melnychuk</p>
</footer>
<script src="writing.js"></script>
</body>
</html>
